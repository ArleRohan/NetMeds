<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card  mb-5 shadow rounded-4 border-0">
        <div class="card-header text-white bg-primary text-center rounded-top-4">
          <h4 class="mb-0">{{ showUpdateBtn ? 'Edit Profile' : 'Register' }}</h4>
        </div>
        <div class="card-body p-4">

          <form>
            <div class="mb-3">
              <label class="form-label">Full Name</label>
              <input type="text" class="form-control form-control-lg" [(ngModel)]="registerData.fullname" name="fullname" required placeholder="Enter your full name">
            </div>

            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control form-control-lg" [(ngModel)]="registerData.email" name="email" required placeholder="Enter your email">
            </div>

            <div class="mb-3">
              <label class="form-label">Gender</label>
              <select class="form-select form-select-lg" [(ngModel)]="registerData.gender" name="gender" required>
                <option value="" disabled selected>Select gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label">Address</label>
              <textarea class="form-control form-control-lg" [(ngModel)]="registerData.address" name="address" rows="3" required placeholder="Enter your address"></textarea>
            </div>

            <div class="d-grid gap-2 mt-4">
              <button *ngIf="!showUpdateBtn" type="button" class="btn btn-success btn-lg" (click)="onRegister()">Register</button>
              <button *ngIf="showUpdateBtn" type="button" class="btn btn-warning btn-lg" (click)="onUpdate()">Update Profile</button>
            </div>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>
