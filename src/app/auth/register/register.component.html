<div class="d-flex mt-3 justify-content-center align-items-center vh-100 bg-light">
  <div class="card mb-5 mt-5 shadow p-4 rounded-4" style="min-width: 400px; max-width: 700px; width: 100%;">
    <h4 class="text-center mb-4 fw-bold">{{ showUpdateBtn ? 'Update Profile' : 'Register' }}</h4>

    <form #form="ngForm" (ngSubmit)="form.valid && (showUpdateBtn ? onUpdate() : onRegister())">
      
      <!-- Full Name -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Full Name</label>
        <input type="text" class="form-control form-control-lg rounded-3" name="fullname" [(ngModel)]="registerData.fullname"
         #fullname="ngModel" required placeholder="Enter your full name">
        <div *ngIf="fullname.invalid && fullname.touched" class="text-danger small">
          Full Name is required.
        </div>
      </div>

      <!-- Email -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Email</label>
        <input type="email" class="form-control form-control-lg rounded-3" name="email" [(ngModel)]="registerData.email"
        #email="ngModel" required email placeholder="Enter your email">
        <div *ngIf="email.invalid && email.touched" class="text-danger small">
          <div *ngIf="email.errors?.['required']">Email is required.</div>
          <div *ngIf="email.errors?.['email']">Enter a valid email address.</div>
        </div>
      </div>

      <!-- Gender -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Gender</label>
        <select class="form-select form-select-lg rounded-3" name="gender" [(ngModel)]="registerData.gender"
        #gender="ngModel" required>
          <option value="" disabled>Select gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>
        <div *ngIf="gender.invalid && gender.touched" class="text-danger small">
          Gender is required.
        </div>
      </div>

      <!-- Address -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Address</label>
        <textarea class="form-control form-control-lg rounded-3"  name="address" [(ngModel)]="registerData.address"
        #address="ngModel" required placeholder="Enter your address" rows="3"></textarea>
        <div *ngIf="address.invalid && address.touched" class="text-danger small">
          Address is required.
        </div>
      </div>

      <!-- Submit Buttons -->
      <div class="d-grid mt-4">
        <button *ngIf="!showUpdateBtn" type="submit" class="btn btn-primary btn-lg rounded-3" [disabled]="form.invalid">Register</button>
        <button *ngIf="showUpdateBtn" type="submit" class="btn btn-warning btn-lg rounded-3" [disabled]="form.invalid">Update Profile </button>
      </div>

    </form>
  </div>
</div>
