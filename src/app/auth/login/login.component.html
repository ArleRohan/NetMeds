<!-- Include Bootstrap CSS in angular.json or index.html -->
<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="row w-100 bg-white rounded-4 shadow p-4" style="max-width: 1000px;">
    
    <!-- Left Image Side -->
    <div class="col-lg-6 d-flex align-items-center justify-content-center mb-4 mb-lg-0">
      <img src="https://www.netmeds.com/images/cms/wysiwyg/cms/1680000865_New_Dest_deal.png"
           alt="Netmeds Banner" class="img-fluid" />
    </div>

    <!-- Right Login Side -->
    <div class="col-lg-6">
      <h4 class="fw-bold mb-2">Sign In / Sign Up</h4>
      <p class="text-muted small mb-4">Sign up or Sign in to access your orders, special offers, health tips and more!</p>

      <!-- Phone Number Input -->
      <label class="form-label text-uppercase small fw-bold text-info">Phone Number</label>
      <div class="input-group input-group-sm mb-3">
        <span class="input-group-text">+91</span>
        <input type="text"
               class="form-control"
               placeholder="Enter your mobile no"
               [(ngModel)]="phoneNumber"
               name="phone" />
      </div>

      <!-- Use OTP Button -->
      <button class="btn btn-sm w-100 text-white mb-3"style="background-color: #24aeb1;" (click)="onUseOtp()">USE OTP</button>

      <!-- OTP Section -->
      <div *ngIf="showOtpBox">
        <label class="form-label">Enter OTP</label>
        <input type="text"
               [(ngModel)]="enteredOTP"
               name="otp"
               class="form-control mb-2"
               placeholder="Enter OTP here" />

        <button class="btn btn-success btn-sm w-100" (click)="verifyOTP()">Verify OTP</button>
      </div>

      <!-- Social Login Buttons -->
      <div class="d-flex justify-content-between gap-2 my-3">
        <button class="btn btn-outline-secondary w-50 d-flex align-items-center justify-content-center gap-2">
          <img src="https://www.netmeds.com/msassets/images/icons/google-icon.png" alt="" width="18"> Google
        </button>
        <button class="btn btn-outline-secondary w-50 d-flex align-items-center justify-content-center gap-2">
          <img src="https://www.netmeds.com/msassets/images/icons/facebook-icon.png" alt="" width="18"> Facebook
        </button>
      </div>

      <!-- Footer -->
      <p class="text-center small text-muted">
        By continuing you agree to our
        <a href="#" class="text-danger text-decoration-none">Terms of service</a> and
        <a href="#" class="text-danger text-decoration-none">Privacy & Legal Policy</a>.
      </p>
    </div>
  </div>
</div>
