<div class="prom-banner">
  <div class="col-sm-12 pull-left">
    <h1>Amino Acids</h1>
    <div class="clearfix"></div>
    <div class="clearfix"></div>
  </div>
</div>

<div id="product_wrapper">
  <input type="hidden" name="product_count" id="product_count" [value]="products.length" />
  <div class="toolbar">
    <div class="number">
      Showing <span id="showing_count">{{ products.length }}</span> of
      <span id="total_count">{{ products.length }}</span> items
    </div>
    <div class="sort-option">
      Sort by:
      <div id="sort-by">
        <div id="sort_container">
          <button class="sort-button active">Popularity</button>
          <button class="sort-button">High to Low</button>
          <button class="sort-button">Low to High</button>
          <button class="sort-button">Discount</button>
        </div>
      </div>
    </div>
    <div class="clearfix"></div>
  </div>

  <div id="mstar_box">
    <div class="white-bg box-padding">
      <div class="all-product">
        <h2 class="all-product-title">ALL PRODUCTS</h2>
        <div class="row product-list">
          <div
            class="col-md-3 padding-none mb-4"
            *ngFor="let product of products"
          >
            <div class="cat-item card p-2 h-100">
              <img
                [src]="product.image"
                [alt]="product.name"
                class="img-fluid mb-2"
                style="height: 200px; object-fit: contain;"
              />
              <h5 class="product-name">{{ product.name }}</h5>
              <p class="product-brand text-muted mb-1">
                {{ product.brand }}
              </p>
              <p class="product-price mb-0">
                <span class="text-success fw-bold">₹{{ product.disc_price }}</span>
                <span class="text-muted text-decoration-line-through ms-2"
                  >₹{{ product.price }}</span
                >
              </p>
              <p class="text-danger fw-bold">{{ product.disc }}% OFF</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
