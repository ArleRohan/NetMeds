<div class="product-detail ">
    <div>
      
    </div>
      <div class="thumbnails mt-4">
        <img *ngFor="let img of product['images']"
             [src]="img"
             width="100"
             height="120"
             class="thumb_imges ms-4 mt-3"
              />
      </div>
      <div class="main-image">
        <img [src]="product.mainImage" width="380" height="500" />
      </div>
      <div  class="mt-4">
    
        <h4 style="width: 240px;">{{product.name}}</h4>
        <div class="d-flex gap-2 mt-4">
          <p class="product-details-gluco-devices" *ngFor="let cat of product.category">{{cat}}</p>
        </div>
        <hr style="color: #c4c4c4; font-weight: 500;">
        <div class="d-flex gap-2">
          <p class="product-details-disc-price">₹{{product.disc_price}} </p>
          <span class="product-detail-price"> MRP ₹{{product.price}}</span>
          <span class="product-discount">Save {{product.disc}} %</span>
        </div>
        <p style="font-size: 12px; color: #a09898;">Inclusive of all taxes</p>
        <ng-container  *ngFor="let content of product['product-content']">
          <p class="product-detail-content">{{content}}</p>
        </ng-container>
      </div>
      
    </div>
